name: CI

on:
  push:
    branches: [ master, dev_major-update ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    # Needed by the coverage-comment action: pull-requests to post the PR comment,
    # contents to push the coverage badge/data to its dedicated data branch on default-branch pushes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        # Desktop/build-only deps (pyqt5, pyinstaller) are intentionally omitted — the test
        # import chain does not touch them.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib simplekml tqdm psutil \
                      requests semantic-version "sqlalchemy>=2.0" "nicegui>=1.4" \
                      pytest pytest-cov
      - name: Run tests
        # The ForRocket binary is not in the repo, so binary-dependent end-to-end tests
        # skip automatically (conftest's binary_path fixture). The binary-independent
        # subset (unit, copy, self-containment guards, stats rebuild, import/dashboard) runs.
        #
        # Coverage is report-only for now (no --cov-fail-under gate): with the e2e tests
        # skipped, the CI number understates the coverage reachable locally with the binary.
        # Scope (runner_tool/post_tool/wind_tool/lib) is set in .coveragerc.
        env:
          MPLBACKEND: Agg
        run: |
          pytest tests/ -v \
            --cov=runner_tool --cov=post_tool --cov=wind_tool --cov=lib \
            --cov-report=term-missing --cov-report=xml
      - name: Coverage PR comment
        # Posts/updates a coverage comment on PRs and a badge on the default branch,
        # entirely within GitHub (no external upload). Reads the .coverage data file.
        # NOTE: fork PRs lack write tokens; if external forks ever send PRs, split this
        # into a workflow_run-triggered job. Internal branch PRs (the current flow) work as-is.
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Store coverage comment artifact
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
